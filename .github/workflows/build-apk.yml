name: Build APK Afnan Assistant

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cek Android SDK bawaan runner
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Install dependencies
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Sesuaikan proyek Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Pakai kunci tanda tangan tetap (agar update tidak menghapus data)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AfnanAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AfnanAssistant-APK
          path: AfnanAssistant.apk
          retention-days: 30

      - name: Terbitkan ke Releases (tag "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Afnan Assistant build ${{ github.run_number }}
          files: AfnanAssistant.apk
          make_latest: true
        continue-on-error: true
