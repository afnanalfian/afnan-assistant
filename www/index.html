<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3B5C" />
  <meta name="format-detection" content="telephone=no" />
  <title>Afnan Assistant</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Kembali" hidden></button>
      <div class="topbar-title">
        <h1 id="page-title">Afnan Assistant</h1>
        <div id="page-sub"></div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <main id="view" tabindex="-1"></main>

    <button id="fab" aria-label="Tambah" hidden></button>

    <nav id="bottomnav">
      <a href="#/home" data-tab="home"><span class="ni" data-icon="home"></span><span>Beranda</span></a>
      <a href="#/planner" data-tab="planner"><span class="ni" data-icon="calendar"></span><span>Planner</span></a>
      <a href="#/habits" data-tab="habits"><span class="ni" data-icon="checkCircle"></span><span>Habit</span></a>
      <a href="#/finance" data-tab="finance"><span class="ni" data-icon="wallet"></span><span>Keuangan</span></a>
      <a href="#/eval" data-tab="eval"><span class="ni" data-icon="chart"></span><span>Evaluasi</span></a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <div id="splash"><div class="splash-logo">A</div><div class="splash-name">Afnan Assistant</div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
