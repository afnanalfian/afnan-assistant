<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset=".55" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDB48C"/>
      <stop offset="1" stop-color="#DE9B72"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2418"/>
      <stop offset="1" stop-color="#22140D"/>
    </linearGradient>
    <clipPath id="circle"><rect width="512" height="512" rx="0"/></clipPath>
  </defs>
  <g id="bgl"><rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#glow)"/>
    <circle cx="430" cy="90" r="34" fill="#FFD23F" opacity=".9"/>
    <circle cx="78" cy="420" r="16" fill="#fff" opacity=".25"/>
    <circle cx="455" cy="380" r="10" fill="#fff" opacity=".3"/>
  </g>
  <g id="person">
    <!-- shirt -->
    <path d="M70 512 C80 455 130 430 196 418 L256 448 L316 418 C382 430 432 455 442 512 Z" fill="#F7F5FB"/>
    <path d="M196 418 L256 448 L316 418 L320 512 L192 512 Z" fill="#ECE8F4"/>
    <!-- neck -->
    <path d="M214 352 L214 420 Q256 452 298 420 L298 352 Z" fill="#C98660"/>
    <!-- collar -->
    <path d="M206 404 L256 446 L228 478 L184 424 Z" fill="#FFFFFF" stroke="#D9D3E6" stroke-width="3" stroke-linejoin="round"/>
    <path d="M306 404 L256 446 L284 478 L328 424 Z" fill="#FFFFFF" stroke="#D9D3E6" stroke-width="3" stroke-linejoin="round"/>
    <!-- tie -->
    <path d="M244 446 L268 446 L274 466 L262 476 L250 476 L238 466 Z" fill="#5E6675"/>
    <path d="M250 476 L262 476 L276 512 L236 512 Z" fill="#6B7383"/>
    <!-- ears -->
    <ellipse cx="160" cy="268" rx="19" ry="31" fill="#DE9B72"/>
    <ellipse cx="352" cy="268" rx="19" ry="31" fill="#DE9B72"/>
    <path d="M156 255 q8 12 0 26" stroke="#C07E58" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M356 255 q-8 12 0 26" stroke="#C07E58" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- face -->
    <path d="M164 206 C162 148 204 126 256 126 C308 126 350 148 348 206 C348 262 344 310 328 344 C312 378 286 396 256 396 C226 396 200 378 184 344 C168 310 164 262 164 206 Z" fill="url(#skin)"/>
    <!-- cheek shading -->
    <path d="M178 300 C186 340 210 372 236 386 C210 384 186 356 178 300 Z" fill="#C98660" opacity=".35"/>
    <path d="M334 300 C326 340 302 372 276 386 C302 384 326 356 334 300 Z" fill="#C98660" opacity=".35"/>
    <ellipse cx="200" cy="300" rx="20" ry="11" fill="#F27A7A" opacity=".22"/>
    <ellipse cx="312" cy="300" rx="20" ry="11" fill="#F27A7A" opacity=".22"/>
    <!-- hair -->
    <path d="M160 238 C150 170 168 112 222 92 C252 80 300 78 328 94 C352 106 364 132 360 168 C358 196 354 220 350 240 C344 214 340 196 332 182 C316 172 296 168 280 170 C262 160 238 158 214 166 C196 172 182 184 176 200 C170 214 166 226 160 238 Z" fill="url(#hair)"/>
    <!-- hair volume / side part -->
    <path d="M214 166 C230 136 262 122 300 124 C320 126 336 136 342 150 C326 140 300 138 282 146 C258 154 236 160 214 166 Z" fill="#4A2F20"/>
    <path d="M232 104 C260 92 296 92 318 102" stroke="#5A3A28" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M196 120 C210 108 226 100 244 96" stroke="#5A3A28" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M176 200 C186 182 200 172 214 166 C206 178 200 190 198 204 Z" fill="#22140D"/>
    <path d="M338 186 C344 200 348 220 350 240 C354 214 356 196 352 176 Z" fill="#22140D"/>
    <!-- eyebrows -->
    <path d="M190 214 C204 206 226 204 242 209" stroke="#2A1910" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M322 214 C308 206 286 204 270 209" stroke="#2A1910" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <g id="eyes">
      <path d="M194 246 C204 232 232 232 242 246 C232 256 204 256 194 246 Z" fill="#fff"/>
      <path d="M270 246 C280 232 308 232 318 246 C308 256 280 256 270 246 Z" fill="#fff"/>
      <circle cx="219" cy="245" r="9.5" fill="#3B2216"/>
      <circle cx="294" cy="245" r="9.5" fill="#3B2216"/>
      <circle cx="222" cy="242" r="3" fill="#fff"/>
      <circle cx="297" cy="242" r="3" fill="#fff"/>
      <path d="M192 245 C204 230 232 230 244 244" stroke="#2A1910" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M268 244 C280 230 308 230 320 245" stroke="#2A1910" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- nose -->
    <path d="M240 292 C244 304 268 304 272 292 C270 282 262 278 256 278 C250 278 242 282 240 292 Z" fill="#D08A63"/><path d="M250 262 C250 274 248 282 244 290" stroke="#C98660" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="246" cy="300" rx="5" ry="3" fill="#9C5E3E" opacity=".6"/>
    <ellipse cx="266" cy="300" rx="5" ry="3" fill="#9C5E3E" opacity=".6"/>
    <!-- mustache shadow -->
    <path d="M226 322 C240 316 272 316 286 322" stroke="#7A4C34" stroke-width="5" fill="none" stroke-linecap="round" opacity=".35"/>
    <!-- smile -->
    <path d="M220 333 C238 348 274 348 292 333" stroke="#8E3B33" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M226 341 C240 356 272 356 286 341 C272 350 240 350 226 341 Z" fill="#C2605A" opacity=".55"/>
    <!-- goatee -->
    <path d="M244 366 C246 384 266 384 268 366 C262 372 250 372 244 366 Z" fill="#3A2418" opacity=".85"/>
  </g>
</svg>
