<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset=".5" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#6B2FF7"/>
    </linearGradient>
    <radialGradient id="lglow" cx=".25" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FFC21A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3A0A5A" flood-opacity=".35"/></filter>
  </defs>
  <g id="bgl">
    <rect width="512" height="512" fill="url(#lg)"/>
    <rect width="512" height="512" fill="url(#lglow)"/>
    <circle cx="256" cy="268" r="178" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="16"/>
    <circle cx="256" cy="268" r="214" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="10"/>
  </g>
  <g id="mark" filter="url(#sh)">
    <!-- huruf A -->
    <path d="M142 388 L232 140 Q256 92 280 140 L370 388" fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- palang = centang -->
    <path d="M178 300 L232 344 L344 238" fill="none" stroke="url(#chk)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- kilau -->
    <path d="M386 104 Q392 134 420 140 Q392 146 386 176 Q380 146 352 140 Q380 134 386 104 Z" fill="#fff"/>
    <circle cx="428" cy="196" r="9" fill="#FFE45C"/>
  </g>
</svg>
